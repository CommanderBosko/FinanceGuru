[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "financeguru"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PySide6"]

[project.scripts]
financeguru = "financeguru.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
